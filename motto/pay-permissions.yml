# Example policy for pay mcp --permissions ./pay-permissions.yml.
# Choose your own per-payment limit and trusted origin before using this file.
# The buyer caps the accepted quote within its required --max-spend option.
# This sample denies positive payments until you deliberately change max_payment.
origins: [http://127.0.0.1:8787]
networks: [localnet]
max_payment: "$0.00"
allow_any_asset: false
